<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>X フォロー中一括CSV出力</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #0f1419;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 8px 0;
      color: #ffffff;
    }
    p {
      font-size: 12px;
      color: #71767b;
      line-height: 1.5;
      margin: 0 0 12px 0;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
      display: block;
      box-sizing: border-box;
      text-align: center;
    }
    .btn-primary {
      background: #1d9bf0;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1a8cd8;
    }
    .btn-secondary {
      background: #2f3336;
      color: #e7e9ea;
    }
    .btn-secondary:hover {
      background: #3e4347;
    }
    #msg {
      font-size: 12px;
      color: #00ba7c;
      margin-top: 6px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <h1>X フォロー中一括CSV出力</h1>
  <p>
    X (旧Twitter) の「フォロー中 (/following)」ページで右下に表示される操作パネルから、自動スクロール取得とCSV出力が行えます。
  </p>
  <button id="btn-show-panel" class="btn btn-primary">操作パネルを表示 / 開始</button>
  <button id="btn-open-x" class="btn btn-secondary">X (x.com) を開く</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
